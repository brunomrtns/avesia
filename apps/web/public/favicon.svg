<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Avesia favicon — neural node icon, clinical teal -->
  <rect width="36" height="36" rx="8" fill="#0f1419"/>
  <!-- Neural connections -->
  <line x1="18" y1="10" x2="11" y2="23" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="18" y1="10" x2="25" y2="23" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="11" y1="23" x2="25" y2="23" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- Nodes -->
  <circle cx="18" cy="10" r="3.5" fill="#2dd4bf"/>
  <circle cx="11" cy="23" r="2.8" fill="#2dd4bf" fill-opacity="0.8"/>
  <circle cx="25" cy="23" r="2.8" fill="#2dd4bf" fill-opacity="0.8"/>
  <!-- Glow on central node -->
  <circle cx="18" cy="10" r="6" fill="#2dd4bf" fill-opacity="0.15"/>
</svg>
