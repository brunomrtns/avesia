# =============================================================================
# docker-compose.prod.yml — Avesia Production Stack
#
# Usage:   docker compose -f docker-compose.prod.yml up -d
# VPS path: /opt/avesia/docker-compose.prod.yml
#
# Services: postgres · redis · minio · api · web · worker
#
# NOTE: No nginx service — the Trivestia nginx (trivestia-nginx) handles
#       reverse proxying for Avesia via /avesia/ path prefix.
#       The api and web containers are connected to trivestia-net so
#       trivestia-nginx can reach them.
#
# Security hardening (every app service):
#   - no-new-privileges: true
#   - cap_drop: [ALL]
#   - read_only: true (with tmpfs /tmp)
#   - non-root user baked into Dockerfiles
# =============================================================================

services:
  # ── PostgreSQL 16 + pgvector ─────────────────────────────────────────────────
  # NOT exposed to host. Only accessible within avesia-net + trivestia-net.
  # Uses pgvector/pgvector image for vector similarity search.
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: avesia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - avesia-postgres-data:/var/lib/postgresql/data
    networks:
      - avesia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  # Exposed on WireGuard interface (10.0.0.1:6379) for the local Whisper worker.
  # NOT accessible from the public internet.
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: avesia-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "10.0.0.1:6379:6379"
    volumes:
      - avesia-redis-data:/data
    networks:
      - avesia-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── MinIO (S3-compatible) ────────────────────────────────────────────────────
  # Exposed on WireGuard interface (10.0.0.1:9100) for the local Whisper worker.
  # NOT accessible from the public internet.
  # ────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: avesia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "10.0.0.1:9100:9000"
    volumes:
      - avesia-minio-data:/data
    networks:
      - avesia-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── API (Fastify) ────────────────────────────────────────────────────────────
  # REST + WebSocket. Port 3100 internal only.
  # Connected to BOTH avesia-net and trivestia-net (so trivestia-nginx can proxy).
  # ────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: avesia-api:latest
    container_name: avesia-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3100
      # Override MinIO/Redis to use Docker service names (not localhost)
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_BUCKET: avesia
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    expose:
      - "3100"
    ports:
      # Bind to WireGuard interface only — allows the local Whisper worker
      # (PC, 10.0.0.2) to call the API directly. NOT accessible from public internet.
      - "10.0.0.1:3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - avesia-net
      - trivestia-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Worker (Python Celery) ───────────────────────────────────────────────────
  # Consumes analysis, summarization, notes-generation, rag-indexing queues.
  # The 'transcription' queue is consumed by the local Whisper worker (GPU machine).
  # Port 3102 internal only (health check server).
  # ────────────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker-python/Dockerfile
    image: avesia-worker:latest
    container_name: avesia-worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Override to use Docker service names (not localhost)
      DATABASE_URL: postgresql://avesia:${POSTGRES_PASSWORD:-avesia_dev_password}@postgres:5432/avesia?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_API_PORT: 9000
      MINIO_BUCKET: avesia
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - avesia-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3102/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOTE: read_only disabled for worker — Celery/spaCy/NLTK need
    # writable paths for temp files, model caches, and pickle serialization.
    tmpfs:
      - /tmp:size=256M,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Web (Vite SPA served by nginx) ───────────────────────────────────────────
  # Static files served by internal nginx on port 3101.
  # Connected to BOTH avesia-net and trivestia-net (so trivestia-nginx can proxy).
  # ────────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: avesia-web:latest
    container_name: avesia-web
    restart: unless-stopped
    expose:
      - "3101"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - avesia-net
      - trivestia-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    # NOTE: read_only disabled for nginx — it needs to write to /var/cache/nginx
    # and the entrypoint script chowns those directories on startup.
    tmpfs:
      - /tmp:size=16M,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ──────────────────────────────────────────────────────────────────────────────
networks:
  avesia-net:
    external: true    # Created by setup: docker network create avesia-net
  trivestia-net:
    external: true    # Already exists (created by trivestia setup)

volumes:
  avesia-postgres-data:
  avesia-redis-data:
  avesia-minio-data:
