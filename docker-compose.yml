# =============================================================================
# docker-compose.yml — Avesia Dev Stack
#
# Services: postgres · redis · minio
# (api/web/worker run via `pnpm dev` on host for hot-reload during development)
#
# Host-exposed ports (dev tooling — no conflicts with trivestia):
#   PostgreSQL  : 5433  (trivestia uses 5432)
#   Redis       : 6380  (trivestia uses 6379)
#   MinIO API   : 9100  (trivestia uses 9000)
#   MinIO Console: 9101
#
# Network: avesia-net (bridge, local)
# =============================================================================

services:
  # ── PostgreSQL 16 + pgvector ─────────────────────────────────────────────────
  # Stores all relational data + vector embeddings (pgvector extension).
  # Uses pgvector/pgvector image which bundles the extension.
  # Host-exposed on 5433 for psql / GUI tools during dev.
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: avesia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - avesia-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - avesia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  # BullMQ job queues + pub/sub for WebSocket fan-out.
  # Host-exposed on 6380 for redis-cli / RedisInsight during dev.
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: avesia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - avesia-redis-data:/data
    networks:
      - avesia-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── MinIO (S3-compatible) ────────────────────────────────────────────────────
  # Object storage for audio recordings, transcripts, documents.
  # Host-exposed: 9100 (S3 API), 9101 (admin console).
  # ────────────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: avesia-minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - avesia-minio-data:/data
    networks:
      - avesia-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          mc alias set local http://localhost:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
          && mc mb local/$${S3_BUCKET} --ignore-existing
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ──────────────────────────────────────────────────────────────────────────────
networks:
  avesia-net:
    driver: bridge

volumes:
  avesia-postgres-data:
  avesia-redis-data:
  avesia-minio-data:
