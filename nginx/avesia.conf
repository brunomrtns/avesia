# =============================================================================
# nginx/avesia.conf — Reverse Proxy for Avesia (Production)
#
# Included into main nginx.conf via:
#   include /etc/nginx/conf.d/avesia.conf;
#
# URL prefix: /avesia/
# Routes:
#   /avesia/api/  → avesia-api:3100  (REST, JSON)
#   /avesia/ws/   → avesia-api:3100  (WebSocket upgrade)
#   /avesia/      → avesia-web:3101  (React SPA, fallback to index.html)
# =============================================================================

# ── WebSocket upgrade map ──────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate limiting zones ────────────────────────────────────────────────────────
# API: 10 req/s per IP, burst 20
limit_req_zone $binary_remote_addr zone=avesia_api_rl:10m rate=10r/s;

# Web: 20 req/s per IP, burst 40
limit_req_zone $binary_remote_addr zone=avesia_web_rl:10m rate=20r/s;

# ── Upstreams ──────────────────────────────────────────────────────────────────
upstream avesia_api {
    server avesia-api:3100;
    keepalive 32;
}

upstream avesia_web {
    server avesia-web:3101;
    keepalive 32;
}

# ── Gzip ───────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/html
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    text/xml
    application/xml+rss
    text/javascript;

# ── Server block ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Max upload size for audio recordings
    client_max_body_size 500m;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── /avesia/api/ → API (REST) ──────────────────────────────────────────────
    location /avesia/api/ {
        limit_req zone=avesia_api_rl burst=20 nodelay;

        # Strip /avesia/api prefix → / for upstream
        rewrite ^/avesia/api/(.*)$ /$1 break;

        proxy_pass http://avesia_api;
        proxy_http_version 1.1;

        # Connection upgrade support (for potential WS within api path)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts for REST
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── /avesia/ws/ → API (WebSocket) ──────────────────────────────────────────
    location /avesia/ws/ {
        limit_req zone=avesia_api_rl burst=20 nodelay;

        # Strip /avesia/ws prefix → / for upstream
        rewrite ^/avesia/ws/(.*)$ /$1 break;

        proxy_pass http://avesia_api;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for persistent WebSocket connections
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    # ── /avesia/ → Web (React SPA) ─────────────────────────────────────────────
    location /avesia/ {
        limit_req zone=avesia_web_rl burst=40 nodelay;

        proxy_pass http://avesia_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Redirect /avesia → /avesia/ (trailing slash) ───────────────────────────
    location = /avesia {
        return 301 /avesia/;
    }
}
