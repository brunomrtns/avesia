# =============================================================================
# nginx/avesia.conf — Reverse Proxy locations for Avesia
#
# This file is INCLUDED into the Trivestia nginx.conf server block.
# It provides routing for /avesia/ path prefix:
#
#   /avesia/api/  → avesia-api:3100  (REST, JSON)
#   /avesia/ws/   → avesia-api:3100  (WebSocket upgrade)
#   /avesia/      → avesia-web:3101  (React SPA, fallback to index.html)
#
# The avesia-api and avesia-web containers are connected to trivestia-net
# via docker-compose.prod.yml networks configuration.
# =============================================================================

# ── Rate limiting zones for Avesia ────────────────────────────────────────────
# API: 10 req/s per IP, burst 20
limit_req_zone $binary_remote_addr zone=avesia_api_rl:10m rate=10r/s;

# Web: 20 req/s per IP, burst 40
limit_req_zone $binary_remote_addr zone=avesia_web_rl:10m rate=20r/s;

# ── Upstreams ─────────────────────────────────────────────────────────────────
upstream avesia_api {
    server avesia-api:3100;
    keepalive 32;
}

upstream avesia_web {
    server avesia-web:3101;
    keepalive 32;
}

# ── /avesia/api/ → API (REST) ─────────────────────────────────────────────────
location /avesia/api/ {
    limit_req zone=avesia_api_rl burst=20 nodelay;

    # Strip /avesia/api prefix → / for upstream
    rewrite ^/avesia/api/(.*)$ /$1 break;

    proxy_pass http://avesia_api;
    proxy_http_version 1.1;

    # Connection upgrade support (for potential WS within api path)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Standard timeouts for REST
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Max upload size for audio recordings and document uploads
    client_max_body_size 500m;
}

# ── /avesia/ws/ → API (WebSocket) ─────────────────────────────────────────────
location /avesia/ws/ {
    limit_req zone=avesia_api_rl burst=20 nodelay;

    # Strip /avesia/ws prefix → / for upstream
    rewrite ^/avesia/ws/(.*)$ /$1 break;

    proxy_pass http://avesia_api;
    proxy_http_version 1.1;

    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for persistent WebSocket connections
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # Disable buffering for real-time streaming
    proxy_buffering off;
}

# ── /avesia/ → Web (React SPA) ────────────────────────────────────────────────
location /avesia/ {
    limit_req zone=avesia_web_rl burst=40 nodelay;

    proxy_pass http://avesia_web;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Redirect /avesia → /avesia/ (trailing slash) ──────────────────────────────
location = /avesia {
    return 301 /avesia/;
}
